<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f7f9fc; }
        .container { max-width: 950px; margin: auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h1, h2 { margin-top: 0; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; max-width: 420px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .error { color: #c62828; font-size: 0.9em; margin-top: 4px; }
        .alert-success { background: #e8f5e9; color: #2e7d32; padding: 10px 14px; border-radius: 4px; margin-bottom: 16px; }
        .alert-error { background: #ffebee; color: #c62828; padding: 10px 14px; border-radius: 4px; margin-bottom: 16px; }
        button, .btn { padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 0.95em; }
        .btn-save { background: #1976d2; color: #fff; }
        .btn-edit { background: #f57c00; color: #fff; }
        .btn-delete { background: #d32f2f; color: #fff; }
        table { width: 100%; border-collapse: collapse; margin-top: 24px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #eef3f8; }
        .actions { display: flex; gap: 8px; }
        .inline-form { display: inline; margin: 0; }
    </style>
</head>
<body>
<div class="container">
    <h1>Employee Management System</h1>

    <!-- Success / Error Alerts -->
    <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>

    <!-- Add Employee Form -->
    <h2>Add New Employee</h2>
    <form th:action="@{/employees}" th:object="${employee}" method="post">
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input id="fullName" type="text" th:field="*{fullName}" placeholder="Enter full name">
            <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="text" th:field="*{email}" placeholder="Enter email">
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="form-group">
            <label for="phone">Phone</label>
            <input id="phone" type="text" th:field="*{phone}" placeholder="10-digit phone number">
            <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>

        <div class="form-group">
            <label for="department">Department</label>
            <input id="department" type="text" th:field="*{department}" placeholder="Enter department">
            <div class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
        </div>

        <div class="form-group">
            <label for="salary">Salary</label>
            <input id="salary" type="number" step="0.01" th:field="*{salary}" placeholder="Enter salary">
            <div class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
        </div>

        <button type="submit" class="btn btn-save">Save Employee</button>
    </form>

    <!-- Employee Table -->
    <h2>Employee List (<span th:text="${#lists.size(employees)}">0</span>)</h2>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Department</th>
            <th>Salary</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(employees)}">
            <td colspan="7">No employees found.</td>
        </tr>
        <tr th:each="emp : ${employees}">
            <td th:text="${emp.id}">1</td>
            <td th:text="${emp.fullName}">Name</td>
            <td th:text="${emp.email}">email@example.com</td>
            <td th:text="${emp.phone}">0771234567</td>
            <td th:text="${emp.department}">IT</td>
            <td th:text="${emp.salary}">70000</td>
            <td class="actions">
                <a th:href="@{/employees/{id}/edit(id=${emp.id})}" class="btn btn-edit">Edit</a>
                <form th:action="@{/employees/{id}/delete(id=${emp.id})}" method="post" class="inline-form"
                      onsubmit="return confirm('Are you sure you want to delete this employee?');">
                    <button type="submit" class="btn btn-delete">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
