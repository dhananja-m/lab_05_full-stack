<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f7f9fc; }
        .container { max-width: 700px; margin: auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; max-width: 420px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .error { color: #c62828; font-size: 0.9em; margin-top: 4px; }
        .alert-error { background: #ffebee; color: #c62828; padding: 10px 14px; border-radius: 4px; margin-bottom: 16px; }
        button, .btn { padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 0.95em; }
        .btn-update { background: #2e7d32; color: #fff; }
        .btn-cancel { background: #757575; color: #fff; margin-left: 8px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Edit Employee</h1>

    <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>

    <form th:action="@{/employees/{id}/update(id=${employee.id})}" th:object="${employee}" method="post">
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input id="fullName" type="text" th:field="*{fullName}">
            <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="text" th:field="*{email}">
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="form-group">
            <label for="phone">Phone</label>
            <input id="phone" type="text" th:field="*{phone}">
            <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>

        <div class="form-group">
            <label for="department">Department</label>
            <input id="department" type="text" th:field="*{department}">
            <div class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
        </div>

        <div class="form-group">
            <label for="salary">Salary</label>
            <input id="salary" type="number" step="0.01" th:field="*{salary}">
            <div class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
        </div>

        <button type="submit" class="btn btn-update">Update Employee</button>
        <a th:href="@{/employees}" class="btn btn-cancel">Cancel</a>
    </form>
</div>
</body>
</html>
